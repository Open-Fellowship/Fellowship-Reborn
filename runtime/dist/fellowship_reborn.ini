; Fellowship Reborn configuration.
;
; This file goes next to Fellowship.exe, in the same folder as dinput8.dll.
; Every key is optional; with the file absent, every plugin runs on its built-in defaults and the
; loader says so in fellowship_reborn.log.
;
; A plugin can also be switched off by simply removing its DLL from plugins\.
;
; This file used to be called fix_enhancers.ini, and open_fellowship.ini before that. If you
; already have one under either old name it is still read, so nothing you set has been lost, and
; the log says which of them it used. Only one is ever read: if several are present this file wins
; and the older ones are ignored entirely, so the loader names the file it chose and you never
; have to guess which one your edits went into.

[loader]
; 0 loads nothing at all. The game runs exactly as it did before the loader was installed, which
; makes this the first thing to try when something goes wrong.
Enabled=1
PluginDirectory=plugins
; Explicit forward target for the dinput8 exports, absolute or relative to the game folder.
; Empty = the normal order: this key, then dinput8_orig.dll, then the system dinput8.dll.
ChainDll=


; ---------------------------------------------------------------------------- Fellowship.exe

; A genuine engine bug: the renderer's guard rect is a hard-coded 3072 x 1024 box, so above
; 3072 pixels wide the outer edges of the screen are culled. Harmless at 640x480.
[edge_popin]
Enabled=1

; Distance fog off and on, live. This is how you tell whether view_distance is doing anything.
; Key must be one of F1 F2 F3 F4, the game binds F5 to F12 to its own cheats.
[fog_toggle]
Enabled=1
Key=F1
StartWithFog=1

; All five of these can also be moved from the dev menu while the game runs, on the Fellowship
; Reborn page. The menu opens at the engine's own values, so it shows what the game does without
; this plugin, and it can only move what is switched on here.
;
; How far the engine bothers to draw. Not a bug fix: the engine's own distances were chosen for
; 2002 hardware and they cost frame rate to raise. On by default because a modern machine has the
; headroom and the pop-in is the most visible thing about the game's age. If your machine does not
; have the headroom, this is the first thing to turn off.
[view_distance]
Enabled=1
FarPlane=1
FadeIgnoresCap=1
VisibilityCells=120          ; the engine's own value is 80. One cell is 2048 units.
IgnoreObjectFade=1
PreloadResources=1

; Pins models to their finest LOD. Costs frame rate in crowded scenes, and is the second thing to
; turn off if the frame rate will not hold.
[model_lod]
Enabled=1

; Holds the VERTICAL field of view constant as the screen widens, so 16:9 shows more of the world
; horizontally instead of less of it vertically.
;
; REQUIRES CameraFieldOfView=0 in Fellowship.ini. That option and this plugin are two answers to
; the same question, and running both moves every inventory icon out of its cell. If you use the
; community patcher with CameraFieldOfView=-1.0, turn this off.
[field_of_view]
Enabled=1
VerticalFOV=0                ; 0 = automatic: the 4:3-equivalent of whatever the game set
IntervalMs=400


; ------------------------------------------------- ported from the community patcher

; Removes the display-mode filter, so the options screen offers every mode the card reports.
; The engine's own 640x480 minimum is left in place.
[resolution_unlock]
Enabled=1

; The FLOOR the engine puts under a frame delta, at 0x51C764. Not a timestep, despite the name
; the community patcher gives it: there is no fixed timestep anywhere in this engine, every
; consumer of frame time multiplies by it directly. The floor matters because the engine's stock
; clock cannot see a frame shorter than 15.6 ms, so above about 64 fps most frames measure zero
; and the floor invents 2 ms of simulation that did not happen, twenty times a second. That is
; why the stock game speeds up when it is unlocked, and lowering the floor is what stops it.
;
; With frame_timing below installed, the delta is measured properly and the floor almost never
; fires. Leave this on anyway: it is what still catches a frame faster than the floor.
[game_speed]
Enabled=1
Timestep=0.0001              ; the engine's own value is 0.002

; THE ONE THAT MAKES IT SMOOTH.
;
; The engine reads its clock with GetTickCount, which advances about every 15.6 ms. At a 60 fps
; cap the two rates beat against each other at exactly 4 Hz, so four times a second the world
; takes a 31 ms step and then a 0 ms one. That is the judder, and no amount of tuning the limiter
; touches it, because the clock reading the frames is coarser than the frames.
;
; This moves the engine's Timer class onto QueryPerformanceCounter. Fourteen call sites and two
; constants; the other forty-six users of the same clock are loading timeouts and are left alone.
; It fixes the frame rate readout at the same time, since that is measured with the same counter.
;
; TickRate is how many ticks a second the engine now counts in. Higher is finer, and costs range:
; the engine stores ticks in 32 bits, so the span before the timer has to re-anchor itself is
; 2^32 / TickRate seconds. 100000 gives 0.01 ms of resolution and 11.9 hours of span, and the
; re-anchor is invisible in game when it does happen. 1000 would be the engine's own behaviour with extra
; steps.
[frame_timing]
Enabled=1
TickRate=100000              ; 1000..1000000

; Caps the frame rate. Third of the three timing plugins and the only one that waits: frame_timing
; gives the engine a clock fine enough to measure a frame, game_speed stops a fast frame being
; reported as a slow one, and this stops the frame time being 800 microseconds in the first place.
;
; MaxFPS=0 is uncapped, and the hook stays installed so the dev menu can still hand it a rate.
; The menu's frame rate slider overrides this while the game runs, and its save button writes the
; value back here.
;
; Mode 0 = sleep (cheap, coarse), 1 = spin (tight, burns a core), 2 = hybrid (sleep then spin).
[fps_limit]
Enabled=1
MaxFPS=60                    ; 0, or 10..1000
Mode=2

; Sets the size of the window the game opens in. CONFLICTS WITH resolution_unlock at one site,
; run one or the other. It warns in the log if it has to undo the other one's work.
[windowed_res]
Enabled=0
Width=640
Height=480


; ---------------------------------------------------------------------------- Fellowship.rfl

; GUI element sizes are authored in pixels for 640x480 and never scaled. Width-based, because
; these are horizontal extents.
[hud_scaling]
Enabled=1
ReferenceWidth=640           ; larger makes everything smaller

; All in-game text is drawn at a fixed pixel size. Height-based, because glyphs must scale
; uniformly or they stretch. Two different references is correct, not an inconsistency.
[text_scaling]
Enabled=1
ReferenceHeight=480          ; larger makes text smaller

; New Game opens the game's own level list instead of starting the configured first level. The
; screen is finished and shipping in every copy of the rfl and nobody has ever reached it; the
; list comes from LevelList.txt next to Fellowship.exe. Two bytes, and if your rfl already carries
; the community hex edit the log says so and nothing is written.
[level_select]
Enabled=1


; Only needed alongside a FOV mod that rewrites the engine's focal numerator, which is what
; CameraFieldOfView=-1.0 in Fellowship.ini does. With a stock numerator there is nothing to fix
; and this plugin's arithmetic reduces to exactly what the engine already does.
[inventory_icons]
Enabled=0


; ---------------------------------------------------------------------------- interactive

; An overlay for changing things while the game runs, toggled with the key immediately under
; Escape. Nothing is hooked until you press it, so leaving this on costs nothing.
;
; The field of view slider publishes its value to field_of_view rather than writing the camera
; itself. If [field_of_view] is disabled, the slider has nothing to drive.
;
; It also carries the game's own cheats as buttons: fly, invincible, kill enemies, full health,
; drop, invisible walls, suicide. They are the engine's own commands, sent the way its own debug
; menu sends them, and they are dead until a level is loaded. No hotkeys are bound for them.
;
; The Fellowship Reborn tab holds the things the engine has no notion of: the player size sliders,
; and the frame rate. The frame rate slider drives [fps_limit] above and its save button writes
; MaxFPS back into this file. Underneath it the tab names the clock the engine is running on,
; read out of the engine itself, which is how to tell whether [frame_timing] is doing its job
; rather than having to take a log line's word for it.
[dev_menu]
Enabled=1
KeyCode=192                  ; VK_OEM_3, the key under Escape. A raw virtual-key code.
FontHeight=16                ; 10..32, raise it at 4K
PointerSpeed=1.0             ; 0.1..10. The menu draws its own pointer, because the game holds
                             ; the system cursor through DirectInput.
CaptureMessages=1            ; Records what the engine prints, from start-up, into a ring the
                             ; menu can show in a box of its own. Most of what this engine prints
                             ; it prints while loading, so capture starts early and the box is
                             ; just a view of it. Nothing to do with flag 0, which is the engine's
                             ; own display and is broken on this build.
LogMessages=0                ; Mirrors what the engine prints into fellowship_reborn.log as well as
                             ; the ring. A great deal of text, and the answer to "the screen never
                             ; came on so I cannot read the box": the engine's last words before
                             ; it stopped end up in the file instead. Per-frame statistics are
                             ; left out; they would be the whole file within a minute.
TakeMouse=1                  ; While the menu is open, the game's own mouse reads return nothing,
                             ; so dragging a slider does not also swing the camera. This is the
                             ; one hook installed at startup rather than on first press, the
                             ; game calls DirectInput8Create once, early.


; The opening movies play through the Windows Media Format runtime (WMVCore.DLL). Wine only stubs
; that, so under Proton, Lutris or a Steam Deck the movie neither plays nor fails: the engine sets
; its "a movie is playing" flag, stops drawing, and waits for an end that never comes. Three bytes
; make the player report that playback did not start, and the game goes straight on.
;
; On Windows the movies work, so there is nothing to fix there. With no Enabled line below, this
; switches itself ON under Wine and OFF on Windows, ntdll either exports wine_get_version or it
; does not, which is a fact rather than a guess. Enabled=1 forces it on anyway, for anyone who
; never wants to sit through the opening again; Enabled=0 keeps the movies everywhere.
[movie_skip]
;Enabled=1


; A DIAGNOSTIC that changes nothing the game does. Writes down what platform this is, Windows or
; Wine and which version, which Direct3D 8 is actually in the process, and the useful one: what
; the game asked CreateDevice for and what it answered. A refused device is a black screen with
; no other symptom, and this is the only place that shows up. Turn it on when a machine you
; cannot see is misbehaving, then turn it off again.
[env_probe]
Enabled=0


; Keeps the game at full-screen SIZE without taking the screen exclusively: the presentation
; parameters are rewritten to windowed on their way into CreateDevice and Reset, and the window is
; restyled to a borderless popup filling the screen. Exclusive full screen hands the window's fate
; to the focus: lose it for an instant and the window is minimised, and this engine draws nothing
; while its window is down. On Windows that is the alt-tab annoyance; under Wine it is a black
; screen you never get back from.
;
; OFF, INCLUDING UNDER WINE. It used to switch itself on there, and it stops the dev menu working
; on a Steam Deck when it does. Both plugins reach the same Direct3D device and which interaction
; breaks the menu is not established yet, so this waits rather than shipping a known failure.
; Turn it on if a lost window is costing you more than the menu is worth.
[borderless]
Enabled=0
Width=0                      ; 0 = the width of the desktop
Height=0                     ; 0 = the height of the desktop


; A DIAGNOSTIC. Draws a known pattern straight to the back buffer and presents it, so a black
; screen can be told apart from a game that is drawing something nobody can see. Off unless you
; are chasing exactly that.
[screen_test]
Enabled=0
; How long each colour is held, in frames. 5 to 600.
;FramesPerColour=60

; A DIAGNOSTIC, not a fix. Reads the engine's own frame mode word and frame counter and writes
; down every change. For the case where Direct3D is healthy and nothing is on screen: it says
; whether the engine is running its frame at all, which is not a question the graphics API can
; answer. Reads only, on its own thread, and hooks nothing.
[frame_state]
Enabled=0
WatchSetter=1                ; Redirects the five-byte prologue of the one function that writes
                             ; the mode word, so every change also names the code that asked for
                             ; it. The only thing this plugin writes to the game; 0 leaves it
                             ; reading and nothing else.


; A DIAGNOSTIC, not a fix. Hooks the engine's universal property getter and records which code
; reads which authored value, so the in-game HUD's draw path can be named. Costs frame rate while
; recording. Leave it off unless you are hunting something.
[hud_probe]
Enabled=0
DumpKey=113                  ; VK_F2. Press once to start recording, again to write the report.


[template_plugin]
Enabled=0
Greeting=hello from plugins\
