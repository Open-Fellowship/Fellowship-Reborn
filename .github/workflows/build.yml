name: build

# The failure this catches has happened twice: a branch that built on the machine it was
# written on and had never been built from a clean checkout, because a file was missing from
# the commit and a warning only fires under MSVC. This does the clean checkout every push.

on:
  push:
    branches: [main, development, "experimental/**"]
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC 32-bit, /W4 /WX
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S runtime -B runtime/build -A Win32

      - name: Build
        run: cmake --build runtime/build --config Release

      # Debug has its own output directory and its own flags, so it can break on its own.
      - name: Build Debug
        run: cmake --build runtime/build --config Debug

      # The tests need no game and no display, so there is no reason for CI not to run them.
      - name: Run the unit tests
        run: ctest --test-dir runtime/build -C Release --output-on-failure

      - name: Check the loader and the plugins were produced
        shell: pwsh
        run: |
          $dist = "runtime/build/dist"
          if (-not (Test-Path "$dist/dinput8.dll")) {
              throw "dinput8.dll was not produced"
          }
          # Exact, not a floor. A lower bound lets a plugin drop out of the build without
          # anything noticing. Update this number in the same commit that adds or removes one.
          $plugins = @(Get-ChildItem "$dist/plugins/*.dll" -ErrorAction SilentlyContinue)
          if ($plugins.Count -ne 24) {
              throw "expected exactly 24 plugins, found $($plugins.Count)"
          }
          if (-not (Test-Path "$dist/fellowship_reborn.ini")) {
              throw "fellowship_reborn.ini was not staged into dist"
          }
          "loader + $($plugins.Count) plugins + ini"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Fellowship Reborn-win32
          path: runtime/build/dist
          if-no-files-found: error

  analyze:
    name: Static analysis
    runs-on: windows-latest
    # Advisory. /analyze reports GetTickCount overflow advice that does not apply here, because
    # every comparison in the tree is an unsigned (now - stored) difference, so this does not
    # gate a merge.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # /analyze:WX- matters: this project builds with /WX, so without it every analysis
      # finding becomes a fatal error instead of the advice it is meant to be.
      - name: Configure with /analyze
        run: cmake -S runtime -B runtime/build-analyze -A Win32 -DCMAKE_C_FLAGS="/analyze /analyze:WX-"

      - name: Build
        run: cmake --build runtime/build-analyze --config Release
